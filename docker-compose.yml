version: "3.8"

services:
  bot:
    build: .
    env_file:
      - .env
    ports: 
      - "5000:5000"
    depends_on:
      - mongo

  mongo:
    image: mongo:latest
    env_file:
      - .env
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_USER}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_PASSWORD}
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data:
    driver: local
